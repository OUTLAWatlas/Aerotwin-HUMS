# DEV-ONLY CONFIG -- anonymous access, no TLS. Do not use this file as-is in
# production; it exists so `docker compose up` gives you a working broker
# without also requiring you to generate certs and a password file just to
# start the stack.
#
# For production: set allow_anonymous false, add a password_file (created
# with `mosquitto_passwd`), and re-enable the cafile/certfile/keyfile/
# tls_version lines below once real certificates are mounted into the
# container (e.g. via a `./certs:/mosquitto/certs:ro` volume).
listener 1883
protocol mqtt

allow_anonymous true

# --- Production TLS (commented out until certs are actually mounted) ---
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.3
# allow_anonymous false
# password_file /mosquitto/config/passwd
