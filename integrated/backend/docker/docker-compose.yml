version: "3.9"

# Local/dev stack. In production:
# - Run `api` as N stateless replicas behind a load balancer / k8s Deployment
#   with an HPA on CPU + request latency.
# - Terminate TLS 1.3 at an ingress (nginx/envoy) or pass real certs into
#   PM_TLS_CERT_PATH / PM_TLS_KEY_PATH for uvicorn to serve TLS directly.
# - Point PM_DATABASE_URL at a managed TimescaleDB cluster, not this
#   single-node container.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PM_DATABASE_URL: postgresql+asyncpg://pm_user:pm_pass@timescaledb:5432/pm_db
      PM_REDIS_URL: redis://redis:6379/0
      PM_MQTT_BROKER_HOST: mosquitto
      PM_MQTT_BROKER_PORT: 1883
      PM_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      PM_ENVIRONMENT: dev
    depends_on:
      - timescaledb
      - redis
      - mosquitto
    volumes:
      - ../models:/srv/app/models:ro
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_pass
      POSTGRES_DB: pm_db
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  timescale_data:
